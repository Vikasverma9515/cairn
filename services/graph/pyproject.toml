[project]
name = "cairn-graph"
version = "0.1.0"
description = "Language-agnostic structure graph for a whole codebase — tree-sitter parsing into a local SQLite symbol/import/call graph, sharded and incremental, built to stay usable at hundreds of thousands of files."
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "mcp>=2.1,<3",
  "qdrant-client>=1.15,<2",
  "fastembed>=0.8,<0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cairn-graph = "cairn_graph.cli:main"
cairn-graph-mcp = "cairn_graph.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
