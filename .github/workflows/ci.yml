name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # crawl.test.ts (packages/indexer) launches a real headless Chromium
      # to crawl a local test server — needs the browser binary installed,
      # it doesn't ship with the playwright npm package itself.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test

      # The `cairn` CLI ships as compiled JS (packages/indexer/dist) so it
      # runs standalone for real consumers without a TS loader — build it
      # before anything that shells out to `npx cairn`.
      - run: npm run build -w @cairn/indexer

      - name: Determinism check (L1 scan is a pure function — no API key needed)
        run: npm run determinism
