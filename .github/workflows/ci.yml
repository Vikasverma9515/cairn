name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Explicit, dependency-ordered build for @cairn/sdk — found live,
      # not theoretical: npm's workspace "prepare" lifecycle fires for
      # every workspace during `npm ci`/`npm install`, but does NOT
      # reliably order *sibling* workspaces by their actual dependency
      # graph. @cairn/sdk depends on @cairn/core; when sdk also had its
      # own "prepare" script, a plain `npm ci` genuinely failed here with
      # sdk's prepare build racing ahead of core's ("Cannot find module
      # '@cairn/core'") — not just in a local repro, a real CI failure.
      # Fixed two ways together: @cairn/sdk's "prepare" script was
      # removed (nothing currently depends on it firing — cairn-dashboard,
      # the one real file:-based external consumer tested this session,
      # shares this same physical dist/ via the file: symlink, already
      # built by the step below) and @cairn/core keeps its own "prepare"
      # safely, since core has zero workspace-sibling dependencies of its
      # own to race against. This explicit step is what actually builds
      # @cairn/sdk's dist now.
      - run: npm run build -w @cairn/sdk

      # crawl.test.ts (packages/indexer) launches a real headless Chromium
      # to crawl a local test server — needs the browser binary installed,
      # it doesn't ship with the playwright npm package itself.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test

      # The `cairn` CLI ships as compiled JS (packages/indexer/dist) so it
      # runs standalone for real consumers without a TS loader — build it
      # before anything that shells out to `npx cairn`.
      - run: npm run build -w @cairn/indexer

      - name: Determinism check (L1 scan is a pure function — no API key needed)
        run: npm run determinism

  # The Python agentic backend (services/graph) is a separate, unrelated
  # package — its own venv, its own dependency graph (tree-sitter,
  # langgraph, qdrant-client, fastembed, mcp), nothing shared with the
  # Node workspaces above. A separate job, not a step bolted onto `test`,
  # so a failure here is attributed to the right half of the monorepo and
  # the two don't block each other's caching.
  graph-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/graph/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: python -m pytest tests/ -v
