<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cairn logo">
  <defs>
    <linearGradient id="bg" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#2C2620"/>
      <stop offset="100%" stop-color="#1B1815"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#sheen)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="29.5" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Waybalance: three real, irregular stones (each a couple of
       overlapping ellipses, not a rectangle), stacked slightly
       off-center the way a hiker actually balances one — same mark
       and proportions the in-product widget button uses. -->
  <g>
    <!-- bottom stone -->
    <ellipse cx="64" cy="83" rx="38" ry="17" fill="#EDE6DA"/>
    <ellipse cx="45" cy="79" rx="18" ry="12" fill="#EDE6DA"/>
    <ellipse cx="86" cy="82" rx="15" ry="11" fill="#EDE6DA"/>
    <!-- middle stone -->
    <ellipse cx="55" cy="61" rx="27" ry="13" fill="#EDE6DA" fill-opacity="0.82"/>
    <ellipse cx="38" cy="58" rx="12" ry="8" fill="#EDE6DA" fill-opacity="0.82"/>
    <ellipse cx="75" cy="59" rx="11" ry="8" fill="#EDE6DA" fill-opacity="0.82"/>
    <!-- top stone, ember — the one placed last -->
    <ellipse cx="74" cy="39" rx="17" ry="10" fill="#E07A3F"/>
    <ellipse cx="84" cy="36" rx="8" ry="6" fill="#E07A3F"/>
  </g>
</svg>
