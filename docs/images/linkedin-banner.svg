      <stop offset="100%" stop-color="#E07A3F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- profile-photo safe zone is roughly x:0-330 y:130-396 — everything
