      <stop offset="0%" stop-color="#242019"/>
      <stop offset="100%" stop-color="#1B1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E07A3F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E07A3F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- profile-photo safe zone is roughly x:0-330 y:130-396 — everything
       meaningful sits right of that, matching how LinkedIn actually
       overlaps a circular photo on this banner -->

  <g transform="translate(400,50) scale(2.3)">
    <ellipse cx="64" cy="83" rx="38" ry="17" fill="#EDE6DA"/>
    <ellipse cx="45" cy="79" rx="18" ry="12" fill="#EDE6DA"/>
    <ellipse cx="86" cy="82" rx="15" ry="11" fill="#EDE6DA"/>
